name: Build WinUI Toolbox

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 硬性校验：包里承载的页面必须是「注入过新皮肤和新拖放脚本」的那一份，
      # 否则直接失败，绝不产出一个界面没变的包。
      - name: Verify embedded page
        shell: pwsh
        run: |
          $p = 'app\TableToolbox\web\index.html'
          if (-not (Test-Path $p)) { Write-Error "page missing: $p"; exit 1 }
          $html = Get-Content $p -Raw -Encoding UTF8
          if ($html -notmatch 'nw-native-theme') { Write-Error "page is NOT skinned (missing nw-native-theme)"; exit 1 }
          if ($html -notmatch 'nw-native-drop')  { Write-Error "page has NO drop script (missing nw-native-drop)"; exit 1 }
          if ($html -notmatch '__nwImportFiles') { Write-Error "page has NO native drop bridge"; exit 1 }
          if ($html -notmatch '__nwHideDrop')    { Write-Error "page has NO mask-hide hook (stuck drop overlay)"; exit 1 }
          if ($html -notmatch 'nw-native-shell')   { Write-Error "page has NO app shell (layout unchanged)"; exit 1 }
          # WebView2 必须使用自定义用户数据目录，否则会在 exe 旁边生成「<exe>.WebView2」文件夹
          $cs = Get-Content 'app\TableToolbox\MainWindow.xaml.cs' -Raw -Encoding UTF8
          if ($cs -notmatch 'TryCreateEnvironmentAsync') { Write-Error "WebView2 custom env init missing"; exit 1 }
          if ($cs -notmatch 'WEBVIEW2_USER_DATA_FOLDER') { Write-Error "WebView2 user data folder not pinned (folder will appear next to exe)"; exit 1 }
          $f = Get-Item $p
          $h = (Get-FileHash $p -Algorithm SHA256).Hash
          Write-Host "PAGE_SIZE=$($f.Length)"
          Write-Host "PAGE_SHA=$h"

      - name: Restore
        working-directory: app/TableToolbox
        run: dotnet restore TableToolbox.csproj

      - name: Publish single-file EXE
        working-directory: app/TableToolbox
        run: >
          dotnet publish TableToolbox.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None
          -p:IncludeAllContentForSelfExtract=true
          -p:PublishTrimmed=false
          -p:EnableCompressionInSingleFile=true
          -p:EnableMsixTooling=true
          -o out

      - name: Stage deliverables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          $exe = Get-ChildItem -Path app\TableToolbox\out -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { Write-Error "No exe found"; exit 1 }
          # 关键：保留编译产物原名，绝不改名（WinAppSDK 1.8 单文件 exe 改名会导致 XAML 解析崩溃）
          Copy-Item $exe.FullName (Join-Path stage $exe.Name) -Force
          Write-Host "EXE_NAME=$($exe.Name)"
          Write-Host "EXE_SIZE=$($exe.Length)"
          Write-Host "EXE_SHA=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          # 发布目录里不应该再出现第二份网页，出现就是打包方式回退了
          $stray = Get-ChildItem -Path app\TableToolbox\out -Filter index.html -Recurse -ErrorAction SilentlyContinue
          if ($stray) { Write-Error "unexpected index.html in publish output: $($stray.FullName)"; exit 1 }

          $readme = @(
            '表格工具箱 · 便携版（绿色，免安装）',
            '',
            '用法：双击 表格工具箱.exe 即可运行。',
            '不要改文件名（Windows App SDK 单文件包改名会启动报错）。',
            '不需要安装，不需要 .NET 运行时，不需要联网；页面已经编译进 exe 内部，没有旁的文件夹要带。',
            '首次运行后 WebView2 的缓存会写到 %LOCALAPPDATA%\TableToolbox\，exe 所在文件夹始终只有一个 exe。',
            '',
            '功能与网页版一致：',
            '  1. 上传两个文件（或直接粘贴/拖文件进窗口）',
            '  2. 选择对比项和附加字段',
            '  3. 预览对比结果，选择输出表格；或切到「派生表格生成」输出派生表',
            '',
            '数据只在本机处理，不联网、不上传。'
          )
          $readme -join "`r`n" | Out-File -Encoding utf8 stage\使用说明.txt

          Compress-Archive -Path stage\* -DestinationPath TableToolbox-Portable.zip -Force
          Write-Host "ZIP_SIZE=$((Get-Item TableToolbox-Portable.zip).Length)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-portable
          path: |
            stage/*.exe
            TableToolbox-Portable.zip

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: winui-v7
          name: 表格工具箱 - 便携版 v7（单文件 · 不再生成文件夹 · 拖放修复）
          body: |
            **下载 `表格工具箱.exe` 直接双击就能用**（zip 里是同一份 exe + 说明，可选）。
            exe 不要改名 —— Windows App SDK 单文件包改名会启动报错。

            本版修的三个问题：
            1. **双击后 exe 旁边不再多出文件夹**：WebView2 的缓存目录改到
               `%LOCALAPPDATA%\TableToolbox\`，exe 所在文件夹只剩它自己；旧版本留下的
               `表格工具箱.exe.WebView2` 会在启动时自动清掉。
            2. **拖放提示框松手后不再卡住**：原生拖放接管后页面收不到 drop，导致「松开即可导入」
               一直挂着；现在落点即收（另加 4 秒看门狗兜底）。同一次拖放也不会再被导入两遍。
            3. 更像原生窗口：记住上次的窗口位置和大小、最小尺寸限制（980×620）、关掉后退手势和
               表单自动填充、非输入区域不再是网页的 I 型光标、外壳文字不可选中、滚到边界不回弹、
               键盘操作才有焦点框。

            v6 的应用化布局（左栏导航 + 顶栏 + 两栏内容）、离线单文件、拖放导入全部保留；
            上传 / 解析 / 对比 / 派生 / 导出的流程一行逻辑都没改。
          files: |
            stage/表格工具箱.exe
            TableToolbox-Portable.zip
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
