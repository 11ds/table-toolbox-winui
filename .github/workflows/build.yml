name: Build WinUI Toolbox

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        working-directory: TableToolbox
        run: dotnet restore TableToolbox.csproj

      - name: Publish single-file EXE
        working-directory: TableToolbox
        run: >
          dotnet publish TableToolbox.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None
          -p:IncludeAllContentForSelfExtract=true
          -p:PublishTrimmed=false
          -p:EnableCompressionInSingleFile=true
          -p:EnableMsixTooling=true
          -o out

      - name: Stage deliverables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          $exe = Get-ChildItem -Path TableToolbox\out -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { Write-Error "No exe found"; exit 1 }
          # 关键：保留编译产物原名，绝不改名（WinAppSDK 1.8 单文件 exe 改名会导致 XAML 解析崩溃）
          Copy-Item $exe.FullName (Join-Path stage $exe.Name) -Force
          Write-Host "EXE_NAME=$($exe.Name)"
          "真 WinUI 3 原生版`n`n双击 exe 即可运行，无需安装任何东西。`n所有功能本地运行，不联网。" | Out-File -Encoding utf8 stage\使用说明.txt
          Compress-Archive -Path stage\* -DestinationPath 表格工具箱-WinUI原生版.zip -Force
          $f = Get-Item 表格工具箱-WinUI原生版.zip
          Write-Host "ZIP_SIZE=$($f.Length)"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: winui-v1
          name: 表格工具箱 - 真 WinUI 原生版
          body: |
            真 WinUI 3 原生界面（Fluent / Mica），自包含单文件 exe，双击即用，完全离线。
            包含识别 / 对比 / 派生三合一功能。
          files: 表格工具箱-WinUI原生版.zip
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
