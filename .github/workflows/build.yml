name: Build WinUI Toolbox

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 硬性校验：包里承载的页面必须是「注入过新皮肤和新拖放脚本」的那一份，
      # 否则直接失败，绝不产出一个界面没变的包。
      - name: Verify embedded page
        shell: pwsh
        run: |
          $p = 'app\TableToolbox\web\index.html'
          if (-not (Test-Path $p)) { Write-Error "page missing: $p"; exit 1 }
          $html = Get-Content $p -Raw -Encoding UTF8
          if ($html -notmatch 'nw-native-theme') { Write-Error "page is NOT skinned (missing nw-native-theme)"; exit 1 }
          if ($html -notmatch 'nw-native-drop')  { Write-Error "page has NO drop script (missing nw-native-drop)"; exit 1 }
          if ($html -notmatch '__nwImportFiles') { Write-Error "page has NO native drop bridge"; exit 1 }
          if ($html -notmatch 'nw-native-shell')   { Write-Error "page has NO app shell (layout unchanged)"; exit 1 }
          $f = Get-Item $p
          $h = (Get-FileHash $p -Algorithm SHA256).Hash
          Write-Host "PAGE_SIZE=$($f.Length)"
          Write-Host "PAGE_SHA=$h"

      - name: Restore
        working-directory: app/TableToolbox
        run: dotnet restore TableToolbox.csproj

      - name: Publish single-file EXE
        working-directory: app/TableToolbox
        run: >
          dotnet publish TableToolbox.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None
          -p:IncludeAllContentForSelfExtract=true
          -p:PublishTrimmed=false
          -p:EnableCompressionInSingleFile=true
          -p:EnableMsixTooling=true
          -o out

      - name: Stage deliverables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          $exe = Get-ChildItem -Path app\TableToolbox\out -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { Write-Error "No exe found"; exit 1 }
          # 关键：保留编译产物原名，绝不改名（WinAppSDK 1.8 单文件 exe 改名会导致 XAML 解析崩溃）
          Copy-Item $exe.FullName (Join-Path stage $exe.Name) -Force
          Write-Host "EXE_NAME=$($exe.Name)"
          Write-Host "EXE_SIZE=$($exe.Length)"
          Write-Host "EXE_SHA=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          # 发布目录里不应该再出现第二份网页，出现就是打包方式回退了
          $stray = Get-ChildItem -Path app\TableToolbox\out -Filter index.html -Recurse -ErrorAction SilentlyContinue
          if ($stray) { Write-Error "unexpected index.html in publish output: $($stray.FullName)"; exit 1 }

          $readme = @(
            '表格工具箱 · 便携版（绿色，免安装）',
            '',
            '用法：把 表格工具箱.exe 放到任意文件夹，双击即可运行。',
            '不需要安装，不需要 .NET 运行时，不需要联网；页面已经编译进 exe 内部，没有旁的文件夹要带。',
            '',
            '功能与网页版一致：',
            '  1. 上传两个文件（或直接粘贴/拖文件进窗口）',
            '  2. 选择对比项和附加字段',
            '  3. 预览对比结果，选择输出表格；或切到「派生表格生成」输出派生表',
            '',
            '数据只在本机处理，不联网、不上传。'
          )
          $readme -join "`r`n" | Out-File -Encoding utf8 stage\使用说明.txt

          Compress-Archive -Path stage\* -DestinationPath TableToolbox-Portable.zip -Force
          Write-Host "ZIP_SIZE=$((Get-Item TableToolbox-Portable.zip).Length)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-portable
          path: TableToolbox-Portable.zip

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: winui-v6
          name: 表格工具箱 - 便携版 v6（应用化布局 + 拖放导入）
          body: |
            单个 exe，绿色免安装，双击即用。页面已编译进 exe 内部，不需要旁边的 web 文件夹。

            本版内容：
            1. 布局重写：左侧导航（表格对比 / 派生表格生成 + 自动生成的步骤列表）、顶部标题栏、
               右侧内容区；宽屏下「配置在左、预览在右、结果整行」，不再是一整页往下滚的网页。
            2. 文件可以直接拖进窗口导入（Excel / WPS / CSV / TXT，可多选）。
            3. 控件与配色按 Windows 11 规范重做。
            4. 上传、解析、对比、派生、导出的流程与网页版完全一致，一行逻辑都没改。
          files: TableToolbox-Portable.zip
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
